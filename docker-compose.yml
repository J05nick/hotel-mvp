# Demo stack: PostgreSQL + the API. Nothing else.
#   docker compose up --build        ->  http://localhost:8000/docs
name: hotel-mvp-lite

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: hotel # demo only
      POSTGRES_DB: hotel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel -d hotel"]
      interval: 3s
      timeout: 3s
      retries: 15

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://hotel:hotel@postgres:5432/hotel
      SEED_DEMO_DATA: "true" # four demo rooms on first start
      HOUSEKEEPING_INTERVAL_SECONDS: ${HOUSEKEEPING_INTERVAL_SECONDS:-60}
      BOOKING_HOLD_TTL_SECONDS: ${BOOKING_HOLD_TTL_SECONDS:-300}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
